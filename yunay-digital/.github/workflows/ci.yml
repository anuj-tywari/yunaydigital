name: CI - Build, Test, Security & Deploy

# Avoid running overlapping pipelines on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Skip code quality, security, and unit tests'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  ARTIFACT_RETENTION_DAYS: 30
  BUILD_DIR: deploy

##########################
# 1) Code quality & lint #
##########################
jobs:
  code-quality:
    if: ${{ github.event.inputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci

      - name: ESLint (warn-only)
        run: npm run lint || echo "::warning::Linting issues found"

      - name: Prettier check (warn-only)
        run: npm run format:check || echo "::warning::Formatting issues found"

      - name: TypeScript type-check (warn-only)
        run: npm run type-check || echo "::warning::Type errors found"

  #####################
  # 2) Security scan  #
  #####################
  security-scan:
    if: ${{ github.event.inputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --only=production

      - name: npm audit (report)
        run: |
          npm audit --audit-level=high > audit-report.txt 2>&1 || true
          if grep -q "found 0 vulnerabilities" audit-report.txt; then
            echo "✅ No vulnerabilities found"
          else
            echo "::warning::Security vulnerabilities found"
            cat audit-report.txt
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.run_number }}
          path: audit-report.txt
          retention-days: 7

      - name: Snyk scan (PRs only, non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  ####################
  # 3) Unit tests    #
  ####################
  test-unit:
    if: ${{ github.event.inputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (non-blocking)
        run: |
          npm run test:unit -- --coverage --coverageReporters=json,lcov,text,html || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  ####################
  # 4) Build & pack  #
  ####################
  build:
    # Build runs after the checks; tests run in parallel but we still wait when packaging.
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache .next directory
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER="${{ github.run_number }}"
          COMMIT_SHA="${{ github.sha }}"
          FULL_VERSION="${VERSION}-build.${BUILD_NUMBER}+${COMMIT_SHA:0:7}"
          echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT

      - name: Build application
        run: |
          export BUILD_VERSION="${{ steps.version.outputs.version }}"
          npm run build

      - name: Prepare deployment folder
        run: |
          ARTIFACT_NAME="deploy-${{ github.run_number }}-${{ github.sha }}"
          rm -rf ${{ env.BUILD_DIR }}
          mkdir -p ${{ env.BUILD_DIR }}
          cp -r .next ${{ env.BUILD_DIR }}/ || true
          cp -r public ${{ env.BUILD_DIR }}/ || true
          cp package.json package-lock.json ${{ env.BUILD_DIR }}/ || true
          cp ecosystem.config.js ${{ env.BUILD_DIR }}/ || true

          # optional post-deploy script (idempotent)
          cat > ${{ env.BUILD_DIR }}/post-deploy.sh <<'EOF'
          #!/bin/bash
          set -e
          echo "Running post-deploy steps"
          # Use npm ci --only=production in deploy environment
          npm ci --only=production
          # optional DB migrations
          npm run db:migrate || true
          echo "post-deploy done"
          EOF
          chmod +x ${{ env.BUILD_DIR }}/post-deploy.sh

          tar -czf deploy.tar.gz -C ${{ env.BUILD_DIR }} .
          echo "Created deploy.tar.gz ($(du -h deploy.tar.gz | cut -f1))"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact-${{ github.run_number }}
          path: deploy.tar.gz
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}